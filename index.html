<style>
/* Layout: one flowing column per plant. Big soft header, two sketched plates floating on color washes, care notes flowing in two loose columns, then a pruning pool with snip sketches and the four seasons. Color = topic, no boxes or chips. */
:root {
  --bg: #f1f4ee;
  --ink: #1f2b24;
  --muted: #5b6b61;
  --leaf: #2f6b45;
  --pool: #e0efe9;

  --water: #2a6aa8;   --water-bg: #dbe9f6;
  --sun: #a06200;     --sun-bg: #f8e8c6;
  --soil: #7a4f2c;    --soil-bg: #eedfd1;
  --friend: #2c7539;  --friend-bg: #dcefd9;
  --foe: #b2363a;     --foe-bg: #f6dcd9;
  --pink: #c4508a;
  --yellow: #e8b923;
  --feed: #6a46a6;    --feed-bg: #e7def6;
  --prune: #217370;

  --f-display: "Fraunces", "Georgia", serif;
  --f-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a16; --ink: #e8efe9; --muted: #a2b3a7; --leaf: #86c99c; --pool: #16292a;
    --water: #93c3f0; --water-bg: #1b2d40; --sun: #f1c46f; --sun-bg: #3a2d12; --soil: #dcb08a; --soil-bg: #33261c;
    --friend: #93d79e; --friend-bg: #1a3322; --foe: #f29d95; --foe-bg: #3d1f1e; --feed: #c6abf3; --pink: #ec94c2; --yellow: #f2cf55; --feed-bg: #2b2240; --prune: #82d6d0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a16; --ink: #e8efe9; --muted: #a2b3a7; --leaf: #86c99c; --pool: #16292a;
  --water: #93c3f0; --water-bg: #1b2d40; --sun: #f1c46f; --sun-bg: #3a2d12; --soil: #dcb08a; --soil-bg: #33261c;
  --friend: #93d79e; --friend-bg: #1a3322; --foe: #f29d95; --foe-bg: #3d1f1e; --feed: #c6abf3; --pink: #ec94c2; --yellow: #f2cf55; --feed-bg: #2b2240; --prune: #82d6d0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1.08rem; line-height: 1.6;
  padding-inline: 18px; padding-block: 26px 56px;
}
.wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 30px; }
h1, h2, h3, .display { font-family: var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 0; }

.head { display: grid; gap: 4px; }
.where { font-style: italic; font-weight: 600; color: var(--leaf); }
h1 { margin: 0; font-weight: 800; font-size: clamp(2.5rem, 10vw, 4rem); line-height: 1.02; letter-spacing: -.005em; text-wrap: balance; }
.sci { margin: 0; font-style: italic; color: var(--muted); font-size: 1.2rem; }

.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: end; }
.pics.single { grid-template-columns: minmax(0, 460px); justify-content: center; }
.pic { margin: 0; display: grid; gap: 2px; min-width: 0; justify-items: center; text-align: center; }
.pic svg, .snip svg { width: 100%; height: auto; display: block; max-width: 100%; }
.pic figcaption { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; font-variation-settings: "SOFT" 100; }
.pic figcaption span { display: block; font-family: var(--f-body); font-weight: 500; font-style: italic; font-size: .92rem; color: var(--muted); }

.wave { width: 100%; height: 22px; display: block; color: var(--leaf); opacity: .5; }

.care { columns: 2 300px; column-gap: 40px; }
.note { break-inside: avoid; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; margin-bottom: 28px; }
.note .ico { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 48% 52% 44% 56% / 55% 45% 55% 45%; background: var(--c-bg); color: var(--c); }
.note .ico svg { width: 28px; height: 28px; filter: url(#sketch-sm); }
.note .body { min-width: 0; display: grid; gap: 4px; }
.note h2 { margin: 0; font-size: 1.3rem; font-weight: 800; color: var(--c); line-height: 1.1; }
.note h2 .swash { display: block; width: 92px; height: 9px; margin-top: 2px; }
.note p { margin: 0; }
.note .lead { font-family: var(--f-display); font-weight: 700; font-size: 1.32rem; line-height: 1.2; font-variation-settings: "SOFT" 100; }
.note .sign { font-weight: 600; }
.note .sign::before { content: "↳ "; color: var(--c); font-weight: 800; }
.mix b { font-weight: 800; }
.mix .plus { color: var(--c); font-family: var(--f-display); font-weight: 900; padding-inline: 3px; }
.yes { font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; color: var(--c); margin-right: 6px; line-height: 1; }
.n-water  { --c: var(--water);  --c-bg: var(--water-bg); }
.n-sun    { --c: var(--sun);    --c-bg: var(--sun-bg); }
.n-soil   { --c: var(--soil);   --c-bg: var(--soil-bg); }
.n-friend { --c: var(--friend); --c-bg: var(--friend-bg); }
.n-foe    { --c: var(--foe);    --c-bg: var(--foe-bg); }
.n-feed   { --c: var(--feed);   --c-bg: var(--feed-bg); }

.prune { background: var(--pool); border-radius: 46px 110px 52px 90px / 60px 70px 80px 50px; padding: 28px 24px 30px; display: grid; gap: 18px; }
.prune h2 { margin: 0; color: var(--prune); font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.prune h2 svg { width: 30px; height: 30px; filter: url(#sketch-sm); }
.how { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.28rem; line-height: 1.35; max-width: 38ch; font-variation-settings: "SOFT" 100; }
.snips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: end; }
.snips:has(> .snip:only-child) { grid-template-columns: minmax(0, 420px); }
.seasons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
.season { min-width: 0; }
.season h3 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 800; color: var(--prune); position: relative; display: inline-block; }
.season h3 .ring { position: absolute; left: -12px; top: -8px; width: calc(100% + 24px); height: calc(100% + 16px); overflow: visible; pointer-events: none; filter: url(#sketch-sm); }
.season small { display: block; margin: 2px 0 4px; font-family: var(--f-body); font-style: italic; font-weight: 600; font-size: .8rem; color: var(--muted); }
.season p { margin: 0; font-size: 1rem; }

.foot { color: var(--muted); font-size: 1rem; font-weight: 700; }
.back { justify-self: start; font-weight: 800; color: var(--leaf); text-decoration: none; font-size: 1.05rem; margin-bottom: -18px; }
.back:hover { text-decoration: underline wavy; text-underline-offset: 5px; }
a { color: inherit; }
a:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; border-radius: 6px; }
.index { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; }
.index a { text-decoration: none; display: grid; gap: 2px; justify-items: center; text-align: center; min-width: 0; }
.index .names { display: grid; gap: 2px; min-width: 0; }
.views { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-family: var(--f-display); font-size: 1.1rem; }
.filters { display: grid; gap: 8px; }
.views { flex-wrap: wrap; }
.vlabel { font-family: var(--f-body); font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 5.6em; }
.viewbtn { font: inherit; font-weight: 700; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: none; }
.viewbtn.on { color: var(--ink); text-decoration: underline wavy var(--leaf); text-underline-offset: 6px; text-decoration-thickness: 2px; }
.viewbtn:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; border-radius: 6px; }
.index.as-list { grid-template-columns: 1fr; gap: 6px; }
.index.as-list a { grid-template-columns: 72px minmax(0, 1fr); align-items: center; justify-items: start; text-align: left; gap: 14px; padding-block: 4px; }
.index.as-list .thumb { width: 72px; }
.index.as-list b { font-size: 1.2rem; }
.index.as-list .names { gap: 0; }
.index .thumb { width: 100%; max-width: 190px; display: block; transition: transform .25s ease; }
.viewbtn .dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .3em; vertical-align: -.05em; border: 1px solid var(--muted); }
.index .thumb svg { width: 100%; height: auto; display: block; }
.index a:hover .thumb { transform: rotate(-2deg) scale(1.03); }
.index b { font-family: var(--f-display); font-size: 1.3rem; font-weight: 800; line-height: 1.15; font-variation-settings: "SOFT" 100; }
.index i { color: var(--muted); font-size: .95rem; }
.index small { color: var(--leaf); font-weight: 600; font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { .index .thumb { transition: none; } }

@media (max-width: 640px) {
  .vlabel { flex-basis: 100%; margin-bottom: -6px; }
  .filters { gap: 12px; }
  .pics, .snips { grid-template-columns: 1fr; }
  .seasons { grid-template-columns: 1fr 1fr; }
  .prune { padding: 24px 18px 26px; border-radius: 36px 70px 40px 60px / 44px 50px 60px 40px; }
}
@media (max-width: 380px) { .seasons { grid-template-columns: 1fr; } }
</style>

    `<path d="M150 198 l-4 10 M151 198 l1 12 M152 198 l5 9" stroke="var(--soil)" stroke-width=".8"/>` + rosetteSide(152, 192, 8, "#d9c7e4", "var(--feed)") +
    `<text x="160" y="226" text-anchor="middle" class="pt"><tspan x="160">it roots and makes a baby</tspan></text>` +
    `<text x="120" y="150" text-anchor="middle" class="pl"><tspan x="120">Let fallen leaves and broken</tspan><tspan x="120" dy="10.4">bits root where they land</tspan></text>`,
    "Diagram: a fallen succulent leaf left on the soil roots and grows a baby rosette"),
};
const ICON = {
  water: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-.3 0-.6.2-.8.4C9.4 5.3 5.5 10.6 5.5 14.5a6.5 6.5 0 0 0 13 0c0-3.9-3.9-9.2-5.7-11.6-.2-.2-.5-.4-.8-.4z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"/></svg>',
  soil: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 14h18l-2 7H5z"/><circle cx="8" cy="10.5" r="2"/><circle cx="13" cy="9" r="2.4"/><circle cx="17.5" cy="11" r="1.7"/></svg>',
  friend: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.7 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.5 0 5.8 3.5 4.5 7.1C19.5 16.4 12 21 12 21z"/></svg>',
  foe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  feed: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v3l3 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9l3-4z"/></svg>',
  prune: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L19 3M16 16L5 3"/></svg>',
};
const SWASH = '<svg class="swash" viewBox="0 0 92 9" aria-hidden="true"><path d="M2 6 C 22 2, 44 8, 62 4 S 84 3, 90 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg>';
const RING = '<svg class="ring" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8 22 C 6 8, 40 3, 70 5 S 99 18, 92 28 S 50 40, 24 36 S 2 26, 14 12" fill="none" stroke="var(--prune)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
const WAVE = '<svg class="wave" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 C 50 2, 90 20, 140 11 S 230 3, 280 12 S 360 20, 400 9" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';

const SEASON_NAMES = { spring: "Spring", summer: "Summer", fall: "Fall", winter: "Winter" };
function currentSeason() {
  const m = new Date().getMonth(); // northern hemisphere
  return m >= 2 && m <= 4 ? "spring" : m >= 5 && m <= 7 ? "summer" : m >= 8 && m <= 10 ? "fall" : "winter";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function art(id) { return PLATES[id] ? PLATES[id]() : ""; }

function careNote(kind, title, inner) {
  return `<section class="note n-${kind}"><div class="ico" aria-hidden="true">${ICON[kind]}</div><div class="body"><h2>${title}${SWASH}</h2>${inner}</div></section>`;
}

function renderPlant(key, p) {
  const now = currentSeason();
  document.title = p.common + " · Balcony Plant Cards";
  const signs = list => (list || []).map(s => `<p class="sign">${esc(s)}</p>`).join("");
  return `
  <a class="back" href="#all"><span aria-hidden="true">←</span> All plants</a>
  <header class="head">
    <span class="where">${esc(p.where)}</span>
    <h1>${esc(p.common)}</h1>
    <p class="sci">${esc(p.sci)}</p>
  </header>

  <section class="pics${p.art.rest ? "" : " single"}" aria-label="What it looks like">
    <figure class="pic">${art(p.art.bloom)}<figcaption>${esc(p.bloomTitle || "In bloom")}<span>${esc(p.bloomNote)}</span></figcaption></figure>
    ${p.art.rest ? `<figure class="pic">${art(p.art.rest)}<figcaption>${esc(p.restTitle || "Not in bloom")}<span>${esc(p.restNote)}</span></figcaption></figure>` : ""}
  </section>

  ${WAVE}

  <div class="care">
    ${careNote("water", "Water", `<p class="lead">${esc(p.water.big)}</p><p>${esc(p.water.text)}</p>`)}
    ${careNote("sun", "Sun", `<p class="lead">${esc(p.sun.big)}</p><p>${esc(p.sun.text)}</p>`)}
    ${careNote("soil", "Soil mix", `<p class="mix">${p.soil.mix.map(m => `<b>${esc(m)}</b>`).join('<span class="plus">+</span>')}</p><p>${esc(p.soil.text)}</p>`)}
    ${careNote("feed", "Fertilize", `<p><span class="yes">${esc(p.feed.big)}</span>${esc(p.feed.text)}</p>`)}
    ${careNote("friend", "Can share a pot with", `<p>${esc(p.friends)}</p>`)}
    ${careNote("foe", "Don't pot with", `<p>${esc(p.foes)}</p>`)}
  </div>

  <section class="prune" aria-label="Pruning">
    <h2>${ICON.prune}Pruning</h2>
    <p class="how">${esc(p.pruneHow)}</p>
    ${p.pruneArt ? `<div class="snips">${p.pruneArt.map(([id]) => `<div class="snip">${art(id)}</div>`).join("")}</div>` : ""}
    <div class="seasons">
      ${Object.keys(SEASON_NAMES).map(s => `<div class="season"><h3>${SEASON_NAMES[s]}${s === now ? RING : ""}</h3>${s === now ? '<small>right now</small>' : ""}<p>${esc(p.seasons[s])}</p></div>`).join("")}
    </div>
  </section>

  <p class="foot"><a href="#all">← Back to all plants</a></p>`;
}

const KIND_WASH = { food: "var(--sun-bg)", pretty: "var(--friend-bg)" };
function thumb(id, kind) { BARE = true; WASH = KIND_WASH[kind]; const s = art(id); BARE = false; WASH = null; return s; }
let VIEW = "gallery", KIND = "all", SIDE = "all";
try { VIEW = localStorage.getItem("plantView") || "gallery"; KIND = localStorage.getItem("plantKind") || "all"; SIDE = localStorage.getItem("plantSide") || "all"; } catch (e) {}
function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function setView(v) { VIEW = v; remember("plantView", v); route(); }
function setKind(v) { KIND = v; remember("plantKind", v); route(); }
function setSide(v) { SIDE = v; remember("plantSide", v); route(); }
const sideOf = p => p.where.toLowerCase().startsWith("west") ? "west" : "east";
function toggles(label, cur, fn, opts) {
  return `<div class="views" role="group" aria-label="${label}"><span class="vlabel">${label}</span>${opts.map(([v, txt], i) => `${i ? '<span aria-hidden="true">/</span>' : ""}<button type="button" id="${fn}-${v}" class="viewbtn${cur === v ? " on" : ""}" aria-pressed="${cur === v}" onclick="${fn}('${v}')">${txt}</button>`).join("")}</div>`;
}
function renderIndex() {
  document.title = "Balcony Plant Cards";
  const list = Object.entries(PLANTS).filter(([k, p]) => (KIND === "all" || p.kind === KIND) && (SIDE === "all" || sideOf(p) === SIDE));
  return `
  <header class="head"><span class="where">Both balconies</span><h1>Balcony plants</h1><p class="sci">Tap a plant, or scan its tag.</p></header>
  <div class="filters">
    ${toggles("Balcony", SIDE, "setSide", [["all", "Both"], ["east", "East"], ["west", "West"]])}
    ${toggles("Type", KIND, "setKind", [["all", "All"], ["food", `<i class="dot" style="background:var(--sun-bg)"></i>Food & herbs`], ["pretty", `<i class="dot" style="background:var(--friend-bg)"></i>Flowers & leafy`]])}
    ${toggles("Show as", VIEW, "setView", [["gallery", "Gallery"], ["list", "List"]])}
  </div>
  ${list.length ? `<nav class="index ${VIEW === "list" ? "as-list" : ""}">${list.map(([k, p]) => `<a href="#${k}"><span class="thumb">${thumb(p.art.bloom, p.kind)}</span><span class="names"><b>${esc(p.common)}</b><i>${esc(p.sci)}</i><small>${esc(p.where.split(" · ")[0])}</small></span></a>`).join("")}</nav>` : `<p class="sci">No plants match yet.</p>`}`;
}

function route() {
  const key = location.hash.slice(1).toLowerCase();
  const keys = Object.keys(PLANTS);
  const app = document.getElementById("app");
  app.innerHTML = PLANTS[key] ? renderPlant(key, PLANTS[key])
    : key === "all" ? renderIndex()
    : keys.length === 1 ? renderPlant(keys[0], PLANTS[keys[0]]) : renderIndex();
  fitDrawings(app);
  window.scrollTo(0, 0);
}
// trim each drawing's empty margins so it sits snugly under its heading
function fitDrawings(root) {
  root.querySelectorAll(".snip svg, .thumb svg").forEach(svg => {
    try {
      const b = svg.getBBox(), pad = 8;
      if (b.width && b.height) svg.setAttribute("viewBox", `${(b.x - pad).toFixed(1)} ${(b.y - pad).toFixed(1)} ${(b.width + pad * 2).toFixed(1)} ${(b.height + pad * 2).toFixed(1)}`);
    } catch (e) {}
  });
}
window.addEventListener("hashchange", route);
route();
</script>
