<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pot Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,500;1,600&display=swap">
<style>
/* colour tokens are copied in from head.html by build.sh */
@@TOKENS@@
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); margin: 0;
  font-family: var(--f-body); font-size: 1.05rem; line-height: 1.5;
  padding: 26px 16px 120px;
}
.wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 26px; }
h1, h2 { font-family: var(--f-display); font-variation-settings: "SOFT" 100; margin: 0; }
h1 { font-size: clamp(2.2rem, 9vw, 3.4rem); font-weight: 800; line-height: 1.05; }
h2 { font-size: 1.6rem; font-weight: 800; }
a { color: var(--leaf); font-weight: 800; }
.back { text-decoration: none; }
.hint { margin: 4px 0 0; color: var(--muted); }
button { font: inherit; cursor: pointer; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 8px 6px 14px; border-radius: 999px; border: 2px solid transparent;
  font-weight: 800; background: var(--friend-bg); color: var(--ink);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.chip.food { background: var(--sun-bg); }
.chip.picked { border-color: var(--leaf); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--leaf); }
.chip .x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 50%; touch-action: manipulation; }
.chip .x:hover { color: var(--foe); }
.palette .chip { padding-right: 14px; }
.ghost { position: fixed; z-index: 10; pointer-events: none; opacity: .9; transform: rotate(-3deg) scale(1.05); box-shadow: 0 8px 20px rgb(0 0 0 / .2); }

.palette { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; border-radius: 24px; background: var(--pool); }
.side { display: grid; gap: 14px; }
.pots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.pot {
  border: 2px dashed var(--muted); border-radius: 22px; padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start;
  min-height: 120px; transition: background .15s, border-color .15s;
}
.pot.over, .wantsdrop .pot:hover { border-color: var(--leaf); background: var(--friend-bg); }
.pot header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pot h3 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; }
.pot .link { font-size: .8rem; font-weight: 700; color: var(--muted); word-break: break-all; }
.pot .plants { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.pot .empty { color: var(--muted); font-style: italic; }
.pot .del { border: 0; background: none; color: var(--muted); font-size: .85rem; font-weight: 700; text-decoration: underline; padding: 0; }
.addpot { justify-self: start; border: 2px solid var(--leaf); color: var(--leaf); background: none; border-radius: 999px; padding: 8px 16px; font-weight: 800; }

.bar {
  position: fixed; inset: auto 0 0 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 2px solid var(--pool); display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.save { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 800; background: var(--leaf); color: var(--bg); }
.save:disabled { opacity: .45; cursor: default; }
.msg { font-weight: 700; color: var(--muted); }
.msg.bad { color: var(--foe); }
.msg.good { color: var(--friend); }

.connect { border-radius: 24px; padding: 18px; background: var(--water-bg); display: grid; gap: 10px; }
.connect ol { margin: 0; padding-left: 1.3em; }
.connect input { font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--muted); background: var(--bg); color: var(--ink); width: 100%; }
.connect .row { display: flex; gap: 10px; flex-wrap: wrap; }
.connect .row input { flex: 1 1 220px; }
.connect button { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 800; background: var(--water); color: var(--bg); }
.small { font-size: .9rem; color: var(--muted); }
.small button { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; font-weight: 700; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="hint">Loading pots…</p></main>
<div class="bar"><span class="msg" id="msg" role="status"></span><button type="button" class="save" id="save" disabled>Save changes</button></div>
<script>
